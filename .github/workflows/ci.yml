# The gate, run on the pull request rather than on the branch.
#
# This repo is PUBLIC and ships no connection details. The no-secrets sweep inside
# `tests/lint.sh` is the only mechanical enforcement of that property, and until this file
# existed nothing ran it except a human who remembered. That is what the `skill-lint` step
# below is for.
#
# ONE job, because GitHub bills every job rounded up to a whole minute: several short jobs bill
# far more than one longer one. Every step after the first gate step runs even when one before
# it failed, so a run still reports every failure, and each step has its own verdict on the run
# page.
#
# Every step invokes `pixi run <task>` and never a bare command line. The step list lives
# in `pyproject.toml` — `check-static` names it once — so adding a step is one more word
# there and nothing here.
#
# What deliberately does NOT run here:
#   * `tests/eval.sh` — every case is a real headless agent session that spends API tokens.
#   * `tests/preflight.sh` — it reads a real `~/.ssh/config`, which a runner does not have.
# Adding either later is a decision, not a tidy-up. `tests/README.md` records which layers
# of the bash suite are meaningful on a runner and which stay local.
#
# There is no `build` step: this repo produces no wheel.
name: ci

on:
  # `pull_request` tests the MERGE commit — the code that will exist after the merge, not the
  # branch tip — and it is the only event that produces a run for a pull request from a fork.
  # Nothing runs on a push to `main`: it would test again what the pull request just tested.
  # `workflow_dispatch` is for checking `main` by hand.
  #
  # `ready_for_review` is listed because a draft runs nothing (the job's `if:` below): open a
  # pull request as a draft, pass the local gate, then mark it ready to run CI once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Keyed on the workflow and the ref, so pushing again to a pull request cancels the run it
# supersedes. A run started by hand is never cancelled.
#
# The draft state is part of the key: a draft's run is skipped, and must not cancel the real
# run that marking the pull request ready starts in the same second.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Skipped on a draft, which bills nothing. A run by hand has no pull request, so it runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, and the history behind them, because the release rule in `tests/lint.sh`
          # compares this tree against the tag named by the version in `plugin.json`. The
          # default shallow checkout fetches no tags, and that rule treats a missing tag
          # list as a failure rather than a pass — a gate with nothing to read is not a
          # gate that agrees with you.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # `docs` is the one environment `default` does not cover: it holds the site builder.
          environments: default docs
          # Fail if `pixi.lock` no longer matches `pyproject.toml`, rather than silently
          # solving something else. This is what makes CI run the versions the laptop ran.
          locked: true
      # `check-static`, `test` and `skill-lint` as three steps, not `check` as one, so each
      # has its own verdict on the run page.
      - run: pixi run check-static
      - run: pixi run test
        if: ${{ !cancelled() }}
      # The repo's own layer-1 suite: manifests, skill frontmatter, the per-skill description
      # cap and the no-secrets sweep. Half of the sweep is machine-local by design — see the
      # note in `tests/README.md` — but everything it can check on a runner, it checks here.
      - run: pixi run skill-lint
        if: ${{ !cancelled() }}
      # `--strict` is in the task, so a broken site is a red pull request rather than a
      # discovery at deploy time. Publishing the site is `docs.yml`, on `main`.
      - run: pixi run docs-build
        if: ${{ !cancelled() }}
